name: Combine Split Client Files

on:
  workflow_dispatch: # Allows you to trigger this manually with a single click

jobs:
  merge-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Stitch Text Pieces into HTML
        run: |
          cat Starlike_Client_Offline-part*.txt > Starlike_Client_Offline_Combined.html

      - name: Commit and Push Restored File Back to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Starlike_Client_Offline_Combined.html
          git commit -m "Automated merge: Rebuilt main HTML asset from split text pieces"
          git push
