name: Ultimate History Recovery and Merge

on:
  workflow_dispatch:

jobs:
  recover-and-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Full Repository History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Pulls full git commit history records

      - name: Extract Split Parts from History Commit
        run: |
          # Pulls the 4 lost text files out of your specific commit ID
          git checkout e6f2d7550ebb14372e9ba740dc56a49dc56a49d4 -- Starlike_Client_Offline-part01.txt || true
          git checkout e6f2d7550ebb14372e9ba740dc56a49dc56a49d4 -- Starlike_Client_Offline-part02.txt || true
          git checkout e6f2d7550ebb14372e9ba740dc56a49dc56a49d4 -- Starlike_Client_Offline-part03.txt || true
          git checkout e6f2d7550ebb14372e9ba740dc56a49dc56a49d4 -- Starlike_Client_Offline-part04.txt || true

      - name: Force Stitch Text Pieces into Index HTML
        run: |
          rm -f index.html
          cat Starlike_Client_Offline-part*.txt > index.html

      - name: Commit and Push Restored Index to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          git add index.html
          git commit -m "Automated merge: Successfully recovered source parts from history commit and generated complete index.html" || echo "No changes"
          git push --force
