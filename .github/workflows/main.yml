name: Direct Cloud Asset Recovery

on:
  workflow_dispatch:

jobs:
  download-and-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Split Parts Directly from Web API
        run: |
          # Downloads the 4 massive text parts straight from your specific healthy commit via raw links
          curl -L "https://githubusercontent.com" -o Starlike_Client_Offline-part01.txt
          curl -L "https://githubusercontent.com" -o Starlike_Client_Offline-part02.txt
          curl -L "https://githubusercontent.com" -o Starlike_Client_Offline-part03.txt
          curl -L "https://githubusercontent.com" -o Starlike_Client_Offline-part04.txt
          
          # Debug step: check if files are actually here and populated
          ls -lh Starlike_Client_Offline-part*.txt

      - name: Stitch Text Pieces into Index HTML
        run: |
          rm -f index.html
          cat Starlike_Client_Offline-part*.txt > index.html

      - name: Commit and Push Restored Index to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          git add index.html
          git commit -m "Automated merge: Rebuilt full index.html via direct cloud downloads" || echo "No changes"
          git push --force
