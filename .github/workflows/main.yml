name: Full History Force Recovery

on:
  workflow_dispatch:

jobs:
  recover-and-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Full Repository History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Force Extract Split Parts from History Commit
        run: |
          # Pulls and forces the files to write directly into your active folder
          git checkout e6f2d7550ebb14372e9ba740dc56a49dc56a49d4 -- Starlike_Client_Offline-part01.txt
          git checkout e6f2d7550ebb14372e9ba740dc56a49dc56a49d4 -- Starlike_Client_Offline-part02.txt
          git checkout e6f2d7550ebb14372e9ba740dc56a49dc56a49d4 -- Starlike_Client_Offline-part03.txt
          git checkout e6f2d7550ebb14372e9ba740dc56a49dc56a49d4 -- Starlike_Client_Offline-part04.txt
          
          # Unstages them so the system treats them as normal files
          git reset HEAD Starlike_Client_Offline-part*.txt

      - name: Stitch Text Pieces into Index HTML
        run: |
          rm -f index.html
          cat Starlike_Client_Offline-part*.txt > index.html

      - name: Commit and Push Restored Index to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Automated merge: Rebuilt full index.html from history records" || echo "No changes"
          git push --force
