name: Universal Path Combine Files

on:
  workflow_dispatch:

jobs:
  merge-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Full Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Locate and Stitch Text Pieces into Index
        run: |
          # Finds where the parts live and stores the folder path
          TARGET_DIR=$(dirname $(find . -name "Starlike_Client_Offline-part01.txt" | head -n 1))
          echo "Found files in directory: $TARGET_DIR"
          
          # Strips out any old placeholder empty files
          rm -f index.html
          rm -f $TARGET_DIR/index.html
          
          # Combines the files directly inside their actual folder location
          cat $TARGET_DIR/Starlike_Client_Offline-part*.txt > $TARGET_DIR/index.html

      - name: Commit and Push Restored File Back to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Automated merge: Stitched files inside their exact directory location" || echo "No changes to commit"
          git push --force
