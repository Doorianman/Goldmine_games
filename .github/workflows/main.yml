name: Precise Combine Split Client Files

on:
  workflow_dispatch:

jobs:
  merge-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Full Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stitch Text Pieces into Index
        run: |
          cat Starlike_Client_Offline-part*.txt > index.html

      - name: Commit and Push Restored File Back to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          git add index.html
          git commit -m "Automated merge: Rebuilt full index.html from exact file match"
          git push
